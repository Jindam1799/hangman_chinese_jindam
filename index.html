<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>진담중국어 - 행맨</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="opening-screen" class="screen">
      <div class="opening-content">
        <h1 class="logo-text">진담중국어</h1>
        <p class="logo-sub">진심이 담긴 중국어</p>
        <span class="blink-text">화면을 터치하여 시작하세요</span>
      </div>
    </div>
    <div id="lobby-screen" class="screen hidden">
      <h2 class="section-title">모드 선택</h2>
      <div class="mode-section">
        <h3>연습 모드 (스테이지 선택)</h3>
        <div id="stage-buttons" class="grid-buttons"></div>
      </div>
      <div class="mode-section">
        <h3>실전 모드</h3>
        <p>10분 타이머! 전체 랜덤 등장, 단 한 번의 실패도 허용되지 않습니다.</p>
        <button id="real-mode-btn" class="primary-btn">실전 모드 시작</button>
        <button id="view-ranking-btn" class="secondary-btn">
          🏆 랭킹 보기
        </button>
      </div>
    </div>
    <div id="game-screen" class="screen hidden">
      <div class="game-header">
        <button id="home-btn" title="로비로 돌아가기">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>로비로 돌아가기</span>
        </button>
        <div id="stage-display" class="header-info">Stage 1 / 20</div>
        <div id="timer-display" class="header-info hidden">⏳ 10:00</div>
        <div id="score-display" class="header-info hidden">
          점수: <span>0</span>
        </div>
        <div class="items">
          <button id="item-meaning" class="item-btn" title="뜻 보기">
            📖 뜻 보기 (<span id="item-meaning-count">3</span>)
          </button>
          <button id="item-hint" class="item-btn" title="50/50 힌트">
            💡 힌트 (<span id="item-hint-count">3</span>)
          </button>
        </div>
      </div>
      <div id="game-container">
        <svg
          id="hangman-drawing"
          width="160"
          height="180"
          viewBox="0 0 160 190"
        >
          <line
            x1="10"
            y1="180"
            x2="150"
            y2="180"
            stroke="#4CAF50"
            stroke-width="8"
            stroke-linecap="round"
          />
          <line
            x1="40"
            y1="180"
            x2="40"
            y2="20"
            stroke="#4CAF50"
            stroke-width="8"
            stroke-linecap="round"
          />
          <line
            x1="36"
            y1="20"
            x2="110"
            y2="20"
            stroke="#4CAF50"
            stroke-width="8"
            stroke-linecap="round"
          />
          <line
            x1="100"
            y1="20"
            x2="100"
            y2="40"
            stroke="#D32F2F"
            stroke-width="3"
          />
          <g id="part-1" class="hangman-part">
            <circle
              cx="100"
              cy="55"
              r="15"
              fill="none"
              stroke="#2c3e50"
              stroke-width="4"
            />
            <path
              d="M 72 45 L 100 22 L 128 45 Z"
              fill="#D32F2F"
              stroke="#b71c1c"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </g>
          <line
            id="part-2"
            x1="100"
            y1="70"
            x2="100"
            y2="120"
            class="hangman-part"
          />
          <line
            id="part-3"
            x1="100"
            y1="80"
            x2="70"
            y2="105"
            class="hangman-part"
          />
          <line
            id="part-4"
            x1="100"
            y1="80"
            x2="130"
            y2="105"
            class="hangman-part"
          />
          <line
            id="part-5"
            x1="100"
            y1="120"
            x2="75"
            y2="160"
            class="hangman-part"
          />
          <line
            id="part-6"
            x1="100"
            y1="120"
            x2="125"
            y2="160"
            class="hangman-part"
          />
        </svg>
        <div id="question-area">
          <h1 id="hanzi"></h1>
          <p id="meaning" class="hidden-meaning">???</p>
          <div id="word-display"></div>
        </div>
        <div id="keyboard">
          <div class="keyboard-row" id="row-1"></div>
          <div class="keyboard-row" id="row-2"></div>
          <div class="keyboard-row" id="row-3"></div>
        </div>
      </div>
    </div>
    <div id="tone-popup" class="hidden">
      <div class="tone-options"></div>
    </div>
    <div id="ranking-modal" class="modal hidden">
      <div class="modal-content">
        <h2>🏆 명예의 전당</h2>
        <ul id="ranking-list" class="scrollable-list"></ul>
        <button id="close-ranking-btn" class="primary-btn">닫기</button>
      </div>
    </div>
    <div id="result-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="result-message"></h2>
        <p id="result-answer"></p>
        <button id="result-tts-btn" class="item-btn tts-btn">
          🔊 발음 듣기
        </button>
        <button id="next-btn">다음</button>
      </div>
    </div>
    <div id="nickname-modal" class="modal hidden">
      <div class="modal-content">
        <h2>게임 오버! 💀</h2>
        <p>최종 점수: <strong id="final-score">0</strong>점</p>
        <p>랭킹에 등록할 닉네임을 입력하세요 (최대 6자)</p>
        <input
          type="text"
          id="nickname-input"
          maxlength="6"
          placeholder="닉네임 입력"
          autocomplete="off"
        />
        <button id="save-score-btn" class="primary-btn">
          저장 및 복습하기
        </button>
      </div>
    </div>
    <div id="review-modal" class="modal hidden">
      <div class="modal-content review-content">
        <h2>📚 학습 복습창</h2>
        <p>오늘 만난 단어들입니다.</p>
        <ul id="review-list" class="scrollable-list"></ul>
        <button id="close-review-btn" class="primary-btn">
          로비로 돌아가기
        </button>
      </div>
    </div>
    <script src="data.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
